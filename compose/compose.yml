services:
  frontend-prod:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
      target: prod
      args:
        - PUBLIC_ENVIRONMENT=${ENVIRONMENT}
        - PUBLIC_API_URL=${PUBLIC_API_URL}
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${FRONTEND_PORT}:4321"
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_NAME=${APP_NAME}
      - PUBLIC_ENVIRONMENT=${ENVIRONMENT}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
    depends_on:
      - api-prod
    networks:
      internal:
      edge:
        aliases:
          - colpruebas-origin
    restart: unless-stopped

  api-prod:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    env_file:
      - path: ../.env
        required: false
    ports:
      - "${API_PORT}:3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_NAME=${APP_NAME}
      - ENVIRONMENT=${ENVIRONMENT}
      - PORT=3000
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  edge:
    name: mis-proyectos-edge
    external: true
    driver: bridge
